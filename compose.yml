services:
  postgres:
    image: postgres:16-alpine
    container_name: sprintboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sprintboard
      POSTGRES_PASSWORD: sprintboard
      POSTGRES_DB: sprintboard
    # Host port 5442 to avoid colliding with a native PostgreSQL on 5432.
    ports:
      - '5442:5432'
    volumes:
      - sprintboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sprintboard']
      interval: 10s
      timeout: 5s
      retries: 5

  # Local mail inbox: accepts any message, delivers nothing outside and shows
  # everything at http://localhost:8026. Used when IS_EMAIL_MOCKED=true.
  # Host ports 1026/8026 because Oxavita/tublood run their own Mailpit on
  # 1025/8025; override with MAILPIT_SMTP_PORT / MAILPIT_UI_PORT (and keep
  # MAILPIT_URL pointing at the SMTP one).
  mailpit:
    image: axllent/mailpit:latest
    container_name: sprintboard-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1026}:1025' # SMTP
      - '${MAILPIT_UI_PORT:-8026}:8025' # web UI
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      retries: 10

volumes:
  sprintboard_pgdata:
