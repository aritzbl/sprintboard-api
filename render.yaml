services:
  - type: web
    name: kanbio-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOW_SWAGGER
        value: "false"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SYNCHRONIZE
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
